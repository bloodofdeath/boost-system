name: Build & Test OptiPulse

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OptiPulse.sln

      - name: Build solution (Release)
        run: dotnet build OptiPulse.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test OptiPulse.sln --configuration Release --no-build --verbosity normal

      - name: Publish portable single-file executable (win-x64)
        run: |
          dotnet publish src/OptiPulse.App/OptiPulse.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -o publish/OptiPulse-win-x64

      - name: Package release zip
        shell: pwsh
        run: Compress-Archive -Path publish/OptiPulse-win-x64/* -DestinationPath OptiPulse-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiPulse-win-x64
          path: OptiPulse-win-x64.zip

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OptiPulse-win-x64.zip
          generate_release_notes: true
